name: ReadFlow Android Build

on:
  push:
    branches:
      - claude/readflow-android-app-5nb6zu
    paths:
      - "ReadFlow/**"
      - ".github/workflows/readflow-android-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ReadFlow/**"
      - ".github/workflows/readflow-android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReadFlow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: readflow-debug-apk
          path: ReadFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK (minified, resource-shrunk)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: readflow-release-apk
          path: ReadFlow/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew test --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readflow-test-results
          path: ReadFlow/app/build/reports/tests/
          if-no-files-found: ignore
